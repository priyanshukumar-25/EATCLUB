<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Swiggy</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Restaurants</a>
            <a href="#">Offers</a>
            <a href="#">Help</a>
        </nav>

        <button class="login">login</button>
    </header>

    <section class="menu">
        <h1>Popular Dishes</h1>
        <p class="subtitle">order your favorite food</p>

        <div class="cards">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38" alt="Pizza">

                <div class="content">
                    <h2>Cheese Pizza</h2>
                    <p class="rating">4.5 ★ 30 mins</p>
                    <p class="description">Delicious cheese pizza with a crispy crust and melted mozzarella.</p>

                    <div class="bottom">
                        <span class="price">₹199</span>
                        <button class="add">Add</button>

                    </div>
                </div>
            
            

            <div class="card">
                <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950"alt="Momos">

                <div class="content">
                    <h2>Samosa</h2>
                    <p class="rating">4.2 ★ 20 mins</p>
                    <p class="description">Steamed dumplings filled with a mix of vegetables and spices.</p>

                    <div class="bottom">
                        <span class="price">₹99</span>
                        <button class="add">Add</button>
                </div>
            </div>
        </div>
            </div>
    </section>
    
</body>
</html>
