<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eat Club — Login</title>
<link rel="stylesheet" href="css/login.css">
<script src="js/login.js" defer></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Eat <span>Club</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#menu">Restaurants</a>
      <a href="index.html#offers">Offers</a>
      <a href="index.html#help">Help</a>
    </nav>
    <a href="index.html" class="top-login-btn">Back to Menu</a>
  </header>

  <div class="container">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to order your favorite food</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-submit">Log in</button>
      </form>

      <div class="divider">or</div>

      <p class="signup-text">New to Eat Club? <a href="#">Sign up</a></p>
    </div>
  </div>

</body>
</html>
